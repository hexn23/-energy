<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<meta name="mobile-web-app-capable" content="yes">
<title>能量补充站 · 视频库</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:#0c0c0f;color:#f2f2f5;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  body.lock{overflow:hidden}

  /* ---------- 顶栏 ---------- */
  .top{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(13px + env(safe-area-inset-top)) 16px 13px;
    background:rgba(12,12,15,.84);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid #1c1c23;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,#ffb02e,#ff6a3d);
    font-size:19px;line-height:1;box-shadow:0 4px 14px rgba(255,120,40,.28);
  }
  .brand .txt{min-width:0}
  .brand h1{margin:0;font-size:15.5px;font-weight:650;letter-spacing:.2px}
  .brand p{
    margin:1px 0 0;font-size:11px;color:#7d7d89;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .add{
    flex:none;padding:9px 15px;border-radius:12px;font-size:14px;font-weight:650;
    background:linear-gradient(135deg,#ffb02e,#ff7a2e);color:#1a1000;
    box-shadow:0 4px 16px rgba(255,140,50,.26);
    transition:transform .12s ease;
  }
  .add:active{transform:scale(.95)}

  /* ---------- 列表 ---------- */
  main{padding:16px 16px 46px;max-width:840px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

  .card{
    background:#151519;border:1px solid #22222b;border-radius:16px;overflow:hidden;
    transition:transform .16s ease,border-color .16s ease;
  }
  .card:active{transform:scale(.975);border-color:#3b3b4a}
  .thumb{
    position:relative;aspect-ratio:3/4;
    background:#1c1c24 center/cover no-repeat;
  }
  .thumb.noimg::after{
    content:"🎞";position:absolute;inset:0;display:grid;place-items:center;
    font-size:32px;opacity:.3;
  }
  .dur{
    position:absolute;left:7px;bottom:7px;padding:2px 6px;border-radius:6px;
    font-size:10.5px;font-weight:650;letter-spacing:.3px;
    background:rgba(0,0,0,.62);backdrop-filter:blur(4px);
  }
  .more{
    position:absolute;right:5px;top:5px;width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;font-size:17px;line-height:1;letter-spacing:1px;
    background:rgba(0,0,0,.48);backdrop-filter:blur(4px);color:#eee;
  }
  .more:active{background:rgba(0,0,0,.75)}
  .body{padding:9px 11px 11px}
  .body h3{
    margin:0;font-size:13.5px;font-weight:600;line-height:1.36;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-all;
  }
  .body p{margin:4px 0 0;font-size:11.5px;color:#797985}

  /* ---------- 空状态 ---------- */
  .empty{padding:64px 20px;text-align:center}
  .empty-ico{font-size:50px;line-height:1;opacity:.45;margin-bottom:16px}
  .empty h2{margin:0 0 9px;font-size:17px;font-weight:650}
  .empty p{margin:0 auto 24px;max-width:300px;font-size:13px;color:#878793;line-height:1.75}
  .primary{
    padding:12px 28px;border-radius:14px;font-size:14.5px;font-weight:650;
    background:linear-gradient(135deg,#ffb02e,#ff7a2e);color:#1a1000;
  }
  .primary:active{transform:scale(.96)}

  /* ---------- 播放层 ---------- */
  .player{
    position:fixed;inset:0;z-index:100;background:#000;
    display:flex;flex-direction:column;
    opacity:0;transition:opacity .18s ease;
  }
  .player.show{opacity:1}
  .close{
    position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:3;
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.15);backdrop-filter:blur(10px);
    display:grid;place-items:center;font-size:15px;
  }
  .close:active{background:rgba(255,255,255,.3)}
  .stage{flex:1;display:grid;place-items:center;min-height:0}
  .stage video{display:block;width:100%;max-height:100%;background:#000}
  .player-foot{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 16px calc(13px + env(safe-area-inset-bottom));
    background:#0a0a0c;border-top:1px solid #1a1a20;
  }
  .player-foot span{
    font-size:13px;color:#c9c9d2;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ghost{
    flex:none;padding:8px 14px;border-radius:10px;
    border:1px solid #2e2e3a;font-size:13px;color:#d0d0da;
  }
  .ghost:active{background:#1e1e27}

  /* ---------- 操作表 ---------- */
  .sheet{position:fixed;inset:0;z-index:200}
  .sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
  .sheet-body{
    position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));
    background:#17171d;border:1px solid #2a2a34;border-radius:20px;padding:8px;
    display:flex;flex-direction:column;gap:2px;
    animation:rise .18s ease;
  }
  @keyframes rise{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-title{
    margin:7px 12px 9px;font-size:11.5px;color:#7e7e8a;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sheet-body button{padding:14px;border-radius:13px;font-size:15px;text-align:center}
  .sheet-body button:active{background:#20202a}
  .sheet-body .danger{color:#ff5f63}
  .sheet-body .ghost{border:0;font-size:15px}

  /* ---------- 处理中 ---------- */
  .busy{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
  .busy-box{
    background:#17171d;border:1px solid #2a2a34;border-radius:18px;
    padding:22px 26px;text-align:center;min-width:190px;max-width:78vw;
  }
  .spinner{
    width:26px;height:26px;margin:0 auto 13px;border-radius:50%;
    border:2.5px solid #2c2c38;border-top-color:#ffb02e;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .busy p{margin:0;font-size:12.5px;color:#b6b6c2;line-height:1.5;word-break:break-all}

  /* ---------- 轻提示 ---------- */
  .toast{
    position:fixed;left:50%;bottom:56px;transform:translate(-50%,10px);z-index:400;
    max-width:82vw;padding:11px 16px;border-radius:12px;
    background:rgba(38,38,48,.96);border:1px solid #3a3a48;
    font-size:13px;color:#ececf2;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">⚡</div>
    <div class="txt">
      <h1>能量补充站</h1>
      <p id="stat">本地视频库</p>
    </div>
  </div>
  <button class="add" id="addBtn">＋ 添加</button>
</header>

<main>
  <div class="grid" id="grid" hidden></div>

  <section class="empty" id="empty">
    <div class="empty-ico">🎬</div>
    <h2>还没有视频</h2>
    <p>点右上角「添加」，从相册里挑几个存进来。<br>视频会复制进这个网页自己的仓库，之后不联网也能看。</p>
    <button class="primary" id="emptyAdd">选择视频</button>
  </section>
</main>

<!-- 播放层 -->
<div class="player" id="player" hidden>
  <button class="close" id="closePlayer" aria-label="关闭">✕</button>
  <div class="stage">
    <video id="video" controls playsinline preload="metadata"></video>
  </div>
  <div class="player-foot">
    <span id="playerTitle"></span>
    <button class="ghost" id="fsBtn">全屏</button>
  </div>
</div>

<!-- 操作表 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet-body">
    <p class="sheet-title" id="sheetTitle"></p>
    <button id="renameBtn">改标题</button>
    <button id="deleteBtn" class="danger">删除</button>
    <button id="cancelBtn" class="ghost">取消</button>
  </div>
</div>

<!-- 处理中 -->
<div class="busy" id="busy" hidden>
  <div class="busy-box">
    <div class="spinner"></div>
    <p id="busyText">处理中…</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="picker" accept="video/*" multiple hidden>

<script>
'use strict';

const $ = id => document.getElementById(id);

const el = {
  grid: $('grid'), empty: $('empty'), stat: $('stat'),
  addBtn: $('addBtn'), emptyAdd: $('emptyAdd'), picker: $('picker'),
  player: $('player'), video: $('video'), closePlayer: $('closePlayer'),
  fsBtn: $('fsBtn'), playerTitle: $('playerTitle'),
  sheet: $('sheet'), sheetBack: $('sheetBack'), sheetTitle: $('sheetTitle'),
  renameBtn: $('renameBtn'), deleteBtn: $('deleteBtn'), cancelBtn: $('cancelBtn'),
  busy: $('busy'), busyText: $('busyText'), toast: $('toast')
};

/* =========================================================
   仓库层：只管“东西存在哪、怎么取”，完全不知道界面长什么样。
   两个抽屉刻意分开：
     meta  —— 目录（标题、封面、时长、大小），很小，列表只读它
     blobs —— 视频本体，很大，只在播放时取那一个
   这正是「打开列表不用把 1.5GB 视频全读出来」的原因。
   ========================================================= */
const DB_NAME = 'energy-vault';
const DB_VER = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('meta')) {
        d.createObjectStore('meta', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('blobs')) {
        d.createObjectStore('blobs', { autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('数据库被另一个页面占用，请关掉其他标签页'));
  });
}

function listMeta() {
  return new Promise((resolve, reject) => {
    const t = db.transaction('meta', 'readonly');
    const r = t.objectStore('meta').getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  });
}

function readBlob(id) {
  return new Promise((resolve, reject) => {
    const t = db.transaction('blobs', 'readonly');
    const r = t.objectStore('blobs').get(id);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}

// 先落视频本体，拿到自动生成的 id，再用同一个 id 写目录
function insertVideo(file, info) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(['blobs', 'meta'], 'readwrite');
    const addReq = t.objectStore('blobs').add(file);
    addReq.onsuccess = () => {
      const id = addReq.result;
      t.objectStore('meta').add({
        id,
        title: cleanName(file.name),
        size: file.size,
        type: file.type || 'video/mp4',
        duration: info.duration,
        cover: info.cover,
        createdAt: Date.now()
      });
    };
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error || addReq.error);
    t.onabort = () => reject(t.error || new Error('写入被中断'));
  });
}

function dropVideo(id) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(['meta', 'blobs'], 'readwrite');
    t.objectStore('meta').delete(id);
    t.objectStore('blobs').delete(id);
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
  });
}

function patchTitle(id, title) {
  return new Promise((resolve, reject) => {
    const t = db.transaction('meta', 'readwrite');
    const s = t.objectStore('meta');
    const g = s.get(id);
    g.onsuccess = () => {
      const m = g.result;
      if (!m) return reject(new Error('找不到这条记录'));
      m.title = title;
      s.put(m);
    };
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
  });
}

/* =========================================================
   媒体工具：读时长 + 截一张封面
   ========================================================= */
function probe(url) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    let done = false;
    const finish = (duration, cover) => {
      if (done) return;
      done = true;
      resolve({ duration: duration || 0, cover: cover || '' });
    };

    v.preload = 'metadata';
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');

    const grab = () => {
      try {
        const vw = v.videoWidth || 640;
        const vh = v.videoHeight || 360;
        const w = 360;
        const h = Math.max(1, Math.round(w * vh / vw));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(v, 0, 0, w, h);
        finish(v.duration, c.toDataURL('image/jpeg', 0.72));
      } catch (e) {
        finish(v.duration, '');
      }
    };

    v.addEventListener('loadedmetadata', () => {
      const d = v.duration;
      if (!isFinite(d) || d <= 0) return grab();
      v.addEventListener('seeked', grab, { once: true });
      try { v.currentTime = Math.min(1, d * 0.12); } catch (e) { grab(); }
      setTimeout(grab, 2200);
    });

    v.addEventListener('error', () => finish(0, ''));
    setTimeout(() => finish(v.duration, ''), 8000);

    v.src = url;
  });
}

function cleanName(name) {
  return String(name || '未命名')
    .replace(/\.[^.]+$/, '')
    .replace(/[_\s]+/g, ' ')
    .trim() || '未命名';
}

function fmtDur(sec) {
  const s = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}

function fmtSize(b) {
  if (!b) return '0 MB';
  if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
  if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
  return Math.max(1, Math.round(b / 1024)) + ' KB';
}

/* =========================================================
   界面块①：列表
   ========================================================= */
let baseStat = '本地视频库';

async function render() {
  const list = (await listMeta()).sort((a, b) => b.createdAt - a.createdAt);

  if (!list.length) {
    el.empty.hidden = false;
    el.grid.hidden = true;
    el.grid.replaceChildren();
    baseStat = '本地视频库';
    paintStat();
    return;
  }

  el.empty.hidden = true;
  el.grid.hidden = false;

  const frag = document.createDocumentFragment();
  for (const m of list) frag.appendChild(buildCard(m));
  el.grid.replaceChildren(frag);

  const total = list.reduce((s, m) => s + (m.size || 0), 0);
  baseStat = `${list.length} 个视频 · ${fmtSize(total)}`;
  paintStat();
}

function buildCard(m) {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.id = m.id;

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (m.cover) {
    thumb.style.backgroundImage = `url("${m.cover}")`;
  } else {
    thumb.classList.add('noimg');
  }

  const dur = document.createElement('span');
  dur.className = 'dur';
  dur.textContent = fmtDur(m.duration);

  const more = document.createElement('button');
  more.className = 'more';
  more.type = 'button';
  more.textContent = '⋯';
  more.setAttribute('aria-label', '更多操作');

  thumb.append(dur, more);

  const body = document.createElement('div');
  body.className = 'body';
  const h3 = document.createElement('h3');
  h3.textContent = m.title;
  h3.title = m.title;
  const p = document.createElement('p');
  p.textContent = fmtSize(m.size);
  body.append(h3, p);

  card.append(thumb, body);
  return card;
}

let quotaText = '';
function paintStat() {
  el.stat.textContent = baseStat + (quotaText ? ' · ' + quotaText : '');
}

async function refreshQuota() {
  if (!navigator.storage || !navigator.storage.estimate) return;
  try {
    const { usage = 0, quota = 0 } = await navigator.storage.estimate();
    if (!quota) return;
    quotaText = `已用 ${fmtSize(usage)} / 上限 ${fmtSize(quota)}`;
    paintStat();
  } catch (e) { /* 忽略 */ }
}

/* =========================================================
   界面块②：添加
   ========================================================= */
async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f =>
    (f.type && f.type.startsWith('video/')) ||
    /\.(mp4|m4v|mov|webm|mkv|avi|3gp)$/i.test(f.name)
  );
  if (!files.length) {
    toast('没认出视频文件，换一个试试');
    return;
  }

  el.busy.hidden = false;
  try {
    // 请求“别随便清我的数据”。浏览器不一定答应，但答案有价值。
    if (navigator.storage && navigator.storage.persist) {
      try { await navigator.storage.persist(); } catch (e) {}
    }

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      el.busyText.textContent = `正在存 ${i + 1}/${files.length}\n${f.name}`;
      await new Promise(r => setTimeout(r, 40)); // 让遮罩先画出来

      const url = URL.createObjectURL(f);
      let info;
      try {
        info = await probe(url);
      } finally {
        URL.revokeObjectURL(url);
      }

      try {
        await insertVideo(f, info);
      } catch (e) {
        if (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''))) {
          throw new Error('浏览器仓库装不下了。先删几个大视频，或挑小一点的再试。');
        }
        throw e;
      }
    }
  } catch (e) {
    console.error(e);
    toast('保存失败：' + (e && e.message ? e.message : e));
  } finally {
    el.busy.hidden = true;
    el.picker.value = '';
    await render();
    await refreshQuota();
  }
}

/* =========================================================
   界面块③：播放
   ========================================================= */
let curUrl = null;

async function openPlayer(m) {
  let blob;
  try {
    blob = await readBlob(m.id);
  } catch (e) {
    toast('读不出来：' + (e.message || e));
    return;
  }
  if (!blob) {
    toast('这个视频的本体找不到了');
    return;
  }

  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(blob);

  el.video.src = curUrl;
  el.playerTitle.textContent = m.title;
  el.player.hidden = false;
  document.body.classList.add('lock');
  requestAnimationFrame(() => el.player.classList.add('show'));
  el.video.play().catch(() => {});
}

function closePlayer() {
  el.video.pause();
  el.video.removeAttribute('src');
  el.video.load();
  if (curUrl) {
    URL.revokeObjectURL(curUrl);
    curUrl = null;
  }
  el.player.classList.remove('show');
  document.body.classList.remove('lock');
  setTimeout(() => { el.player.hidden = true; }, 180);
}

async function toggleFull() {
  const v = el.video;
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if (v.requestFullscreen) {
      await v.requestFullscreen();
    } else if (v.webkitEnterFullscreen) {
      v.webkitEnterFullscreen();
    } else {
      toast('这台手机不支持全屏按钮，横过来看也行');
    }
  } catch (e) {
    toast('全屏被系统拒绝了');
  }
}

/* =========================================================
   操作表：改标题 / 删除
   ========================================================= */
let sheetMeta = null;

function openSheet(m) {
  sheetMeta = m;
  el.sheetTitle.textContent = m.title;
  el.sheet.hidden = false;
}

function closeSheet() {
  el.sheet.hidden = true;
  sheetMeta = null;
}

/* =========================================================
   事件绑定
   ========================================================= */
el.addBtn.addEventListener('click', () => el.picker.click());
el.emptyAdd.addEventListener('click', () => el.picker.click());

el.picker.addEventListener('change', e => {
  if (e.target.files && e.target.files.length) handleFiles(e.target.files);
});

el.grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = Number(card.dataset.id);
  listMeta().then(list => {
    const m = list.find(x => x.id === id);
    if (!m) return;
    if (e.target.closest('.more')) {
      openSheet(m);
    } else {
      openPlayer(m);
    }
  });
});

el.closePlayer.addEventListener('click', closePlayer);
el.fsBtn.addEventListener('click', toggleFull);

el.sheetBack.addEventListener('click', closeSheet);
el.cancelBtn.addEventListener('click', closeSheet);

el.renameBtn.addEventListener('click', async () => {
  if (!sheetMeta) return;
  const m = sheetMeta;
  closeSheet();
  const next = prompt('给它起个名字', m.title);
  if (next === null) return;
  const title = next.trim();
  if (!title) return;
  try {
    await patchTitle(m.id, title);
    await render();
  } catch (e) {
    toast('改名失败：' + (e.message || e));
  }
});

el.deleteBtn.addEventListener('click', async () => {
  if (!sheetMeta) return;
  const m = sheetMeta;
  closeSheet();
  if (!confirm(`确定删掉「${m.title}」？\n\n（只删网页仓库里的这份，相册原件还在）`)) return;
  try {
    await dropVideo(m.id);
    await render();
    await refreshQuota();
    toast('已删除');
  } catch (e) {
    toast('删除失败：' + (e.message || e));
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!el.sheet.hidden) return closeSheet();
  if (!el.player.hidden) return closePlayer();
});

/* 轻提示 */
let toastTimer = null;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600);
}

/* =========================================================
   启动
   ========================================================= */
(async function boot() {
  try {
    db = await openDB();
  } catch (e) {
    console.error(e);
    el.empty.querySelector('h2').textContent = '浏览器仓库打不开';
    el.empty.querySelector('p').textContent =
      '可能是隐私/无痕模式，或者浏览器禁用了本地存储。换一个普通窗口，或换 Chrome 再试。';
    el.addBtn.disabled = true;
    return;
  }
  await render();
  await refreshQuota();
})();
</script>
</body>
</html>
